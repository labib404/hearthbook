<!doctype html>

<head>
<meta charset="utf-8">

<meta name="description" content="Hearthbook — a household budget that lives on your device: envelopes, bills, savings goals and a clear month summary.">
<meta name="theme-color" content="#f4efe4">
<title>Hearthbook · household budget</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/parts.css">
<script>
  // Pick light or dark before the first paint so the page never flashes the wrong theme.
  try {
    var saved = JSON.parse(localStorage.getItem('hearthbook.v1') || '{}').settings || {};
    var t = saved.theme || 'system';
    if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
  } catch (e) {}
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>

<div class="shell">
  <aside class="side" aria-label="Main">
    <a class="brand" href="#/home" aria-label="Hearthbook, overview">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M8 15l8-7 8 7v9H8z"/><path d="M13 24v-5h6v5"/></svg>
      <span>Hearthbook</span></a>
    <nav id="side-nav" class="side-nav" aria-label="Pages"></nav>
    <p class="side-foot">Private by design: your figures never leave this device.</p>
  </aside>
  <div class="main">
    <header class="top">
      <a class="brand brand-top" href="#/home" aria-label="Hearthbook, overview">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M8 15l8-7 8 7v9H8z"/><path d="M13 24v-5h6v5"/></svg></a>
      <div class="month" role="group" aria-label="Month">
        <button type="button" class="icon-btn" id="month-prev" aria-label="Previous month"><svg class="i" aria-hidden="true"><use href="#i-left"></use></svg></button>
        <h2 class="month-label" id="month-label" aria-live="polite">Month</h2>
        <button type="button" class="icon-btn" id="month-next" aria-label="Next month"><svg class="i" aria-hidden="true"><use href="#i-right"></use></svg></button>
        <button type="button" class="btn btn-small btn-ghost" id="month-today" hidden>This month</button>
      </div>
      <div class="top-actions">
        <a href="#/reports" class="icon-btn top-only" id="top-reports" aria-label="Reports"><svg class="i" aria-hidden="true"><use href="#i-chart"></use></svg></a>
        <a href="#/settings" class="icon-btn top-only" id="top-settings" aria-label="Settings"><svg class="i" aria-hidden="true"><use href="#i-gear"></use></svg></a>
        <button type="button" class="btn btn-primary add-top" id="fab" aria-label="Add a transaction" title="Add a transaction (N)"><svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg><span>Add</span></button>
      </div>
    </header>
    <div id="banner" class="banner" role="note" hidden></div>
    <main id="view" class="view" tabindex="-1"><p class="loading">Opening your budget…</p></main>
  </div>
</div>
<nav id="tab-nav" class="tabs" aria-label="Pages"></nav>
<dialog id="entry" class="sheet" aria-labelledby="entry-title"></dialog>
<dialog id="form" class="sheet"></dialog>
<dialog id="confirm" class="sheet sheet-small"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">Hearthbook needs JavaScript turned on to keep your budget.</p></noscript>
</body>
</html>
